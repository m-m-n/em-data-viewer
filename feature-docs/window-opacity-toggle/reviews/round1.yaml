      SPEC の Test Scenarios 側の記述はより緩く読めるため SPEC 内部にも揺れがある。
      Caps Lock は LockMask を立てるので、ShiftMask を弾いても大文字 keyval 経路は
      壊れない。既存入力（drag-to-move / 右クリックメニュー / scroll block）への
      実害はない。
    suggestion: >-
      (a) isToggleBackgroundKeyEvent で ShiftMask を弾き、テストに
      「Ctrl+Shift+T → false」「Ctrl+Lock+T → true」を追加する、または
      (b) Ctrl+Shift+T も受理する意図なら SPEC FR7 本文を Alt/Super のみ除外と
      明記して齟齬を解消する。
