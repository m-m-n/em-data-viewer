findings:
  - stable_id: 30df4ac583821833
    severity: high
    category: spec
    file: contrib/gnome-shell-extension/keep-above@em-data-viewer.m-m-n.github.io/extension.js
    line: 5
    title: "The first available identifier prematurely determines the match"
    description: "SPEC FR2 requires matching via get_gtk_application_id() or get_wm_class() and handling late-arriving ids. appIdOf() uses gtkId || wmClass, so a non-target wm_class can be treated as final while the GTK application ID is still absent; _maybeApply()/_recheck() then finalize a non-match and detach the watches. If the GTK ID later becomes the target, make_above() is never called, violating FR2's late-ID edge case."
    suggestion: "Evaluate both identifiers independently. Apply when either equals TARGET_APP_ID, and do not finalize a nonmatch merely because only one nonmatching identifier has arrived while the other remains unset."
    sources: [codex:spec]
    confidence: 50
    resolution: fixed
    resolution_reason: "task0003 で修正(c27712e)、round 2 の再レビューで解消を確認"
  - stable_id: 272c51154d0baa96
    severity: medium
    category: spec
    file: Makefile
    line: 118
    title: "Known-install enable failures are silently accepted"
    description: "SPEC FR5 requires enabling the uuid, with re-login guidance for the fresh-install case. The unconditional `|| true` suppresses every enable failure, including failures for a previously known installation where fresh=0; the target then succeeds without enabling the extension or printing re-login guidance."
    suggestion: "Tolerate an enable failure only for the specifically detected fresh/unknown-extension case. For a known installation, propagate the command failure so the target cannot report success while the extension remains disabled."
    sources: [codex:spec]
    confidence: 50
    resolution: fixed
    resolution_reason: "task0003 で修正(c27712e)、round 2 の再レビューで解消を確認"
  - stable_id: 34d210ad32419055
    severity: medium
    category: security
    file: contrib/gnome-shell-extension/keep-above@em-data-viewer.m-m-n.github.io/extension.js
    line: 40
    title: "Client-controlled application ID grants always-on-top privileges"
    description: "The extension authorizes make_above() solely by comparing get_gtk_application_id() or get_wm_class() with a fixed string. Both identifiers are supplied by the client window, so an untrusted local application can impersonate the target ID and obtain a persistent always-on-top window (UI-redressing/phishing opportunity). claude:security judged the same site below threshold (keep-above is a benign stacking hint); codex:security flagged it at medium."
    suggestion: "Do not treat the application ID or WM class as an authorization credential. Validate a compositor-derived PID against the expected executable before calling make_above(); reject windows whose identity cannot be verified."
    sources: [codex:security]
    confidence: 50
    resolution: fixed
    resolution_reason: "task0003 で PID 検証を実装(c27712e)、round 2 の再レビューで解消を確認(basename 比較の強度は round 2 finding 232ed1631a33e6d7 として別途 declined)"
