    title: "EffectiveOpacity のフォールバック解決でパースエラーを握り潰しており、最悪値 0.0 に落ちる"
    description: >-
      `fallback, _ := strconv.ParseFloat(WindowStyleDefaults[key], 64)` はエラーを
      捨てているため、WindowStyleDefaults の該当値がパース不能になった瞬間に
      fallback が 0.0（完全透明）になる。0.0 は安全側ではなく最悪側で、起動直後から
      ウィンドウが不可視になり、しかも無言で起きる。ドリフトガード
      TestStyleDefaults_MatchDesignTokens は tokens.yaml と defaults テーブルの一致
      と空でないことしか見ていないので、両者を揃えて非数値にしてもテストは緑のまま
      通り、この経路を防げない。
    suggestion: >-
      最終フォールバックを検証済みパーサ経由かつ可視側（1.0）に倒す:
      `fallback := parseOpacity(WindowStyleDefaults[key], 1.0)`。加えて
      TestStyleDefaults_MatchDesignTokens で両トークン値が 0.0-1.0 の float として
      パースできることも表明する。
    sources: [claude:comprehensive]
    confidence: 65
