    title: "parseOpacity が NaN を「範囲内」として受理し、FR4 のフォールバックが働かない"
    description: >-
      SPEC FR4 は「0.0-1.0 の inclusive range に収まるときだけ受理し、解釈不能な値
      および範囲外の値は該当キーの既定値へフォールバックする」と規定している。NaN は
      その範囲内の値ではないため FR4 の受理条件に反する。上の comprehensive 観点の
      指摘と同一の物理的欠陥を、仕様準拠の側面から捉えたもの（行位置が 5 行を超えて
      離れているため same_site 判定では統合されない）。加えて "0x1p-1" のような 16
      進浮動小数点表記も ParseFloat が受理するため、FR4 の "decimal number" という
      限定からは外れる（範囲内に収まるため実害は小さい）。
    suggestion: >-
      `if n < 0.0 || n > 1.0` を `if !(n >= 0.0 && n <= 1.0)` に置き換え、
      TestParseOpacity_FallsBackForUnusableInput に NaN ケースを追加する。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "severity medium — R4 auto-fix candidate gate (critical/high のみ) の対象外"
  - stable_id: 09327f0071d7f688
