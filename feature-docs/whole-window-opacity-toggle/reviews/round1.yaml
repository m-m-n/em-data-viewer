findings:
  - stable_id: aa4c05591f9489f1
    severity: medium
    category: comprehensive
    file: internal/ui/style.go
    line: 196
    title: "parseOpacity の範囲チェックを NaN がすり抜ける"
    description: >-
      strconv.ParseFloat は "NaN" / "nan" / "-nan" を err==nil で受理する。続く
      `if n < 0.0 || n > 1.0` は NaN に対して両方 false になるため、NaN がそのまま
      返る。"inf" は n > 1.0 が true で fallback に落ちるのに、NaN だけが素通りする。
      結果として window.style.opacity: NaN を書いた config で applyOpacity →
      SetOpacity(NaN) に到達する。GTK 側の CLAMP も NaN を素通しし、alpha =
      round(NaN*255) の guint8 変換は実装依存（x86-64 では 0）なので、ウィンドウが
      完全に不可視になり、エラーバナーも出ない。SPEC FR4 の「0.0-1.0 の範囲内での
      み受理し、範囲外は各キーの既定値へフォールバック」という契約に反する経路で、
      style_test.go の TestParseOpacity_FallsBackForUnusableInput にも NaN ケースが
      ない。
    suggestion: >-
      範囲チェックを「含まれることの肯定形」で書けば NaN も弾ける（新規 import 不要）:
      `if n < 0.0 || n > 1.0` を `if !(n >= 0.0 && n <= 1.0)` に置き換える。
      あわせて TestParseOpacity_FallsBackForUnusableInput に NaN ケースを追加する。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: "severity medium — R4 auto-fix candidate gate (critical/high のみ) の対象外"
  - stable_id: cde75b3d5893778e
