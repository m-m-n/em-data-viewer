    file: internal/app/events.go
    line: 186
    title: "Gate readiness can precede successful section projection"
    description: "pre-arm バッファは readiness シグナルのみを保存し、イベントの UI 効果を保存しない。applyConfig は SetSections の dispatch より先にランナーを起動するため、速いイベントの UpdateSection callback が widget 生成前に main loop で実行されて捨てられ、rehydrationsFor は計算済みの空 store を掴んでいる。バッファされた受領が gate を完了させ、空のセクションで present されうる。「received」が「presentation model に適用済み」を意味しない点で event-before-arm 修正が構造的に不完全。"
    suggestion: "config projection がセクションを生成するまでイベントをバッファして UpdateSection 成功後に markReceived するか、Runner.Apply がイベントを生みうる前に projection の dispatch を保証する。"
    sources: [codex:architecture]
    confidence: 50
    resolution: unresolved
    resolution_reason: "rework (task0004) で修正予定: applyConfig の順序変更 (projection dispatch → gate.arm → r.Apply)"
  - stable_id: 86803c68798485df
    severity: high
    category: spec
    file: internal/app/reload.go
    line: 108
    title: "Pre-arm events can still be discarded before presentation"
    description: "SPEC US1 は「全セクション populated で表示」を要求するが、r.Apply(line 108) が projection queue (116-127) と gate.arm(129) より先。速いイベントが UpdateSection → SetSections → Present の FIFO 順になった場合、sections.go の updateSection は widget 不在で無視し、SetSections が空出力で再構築、受領会計だけ満たされて未反映データのまま present されうる。"
    suggestion: "SetSections projection が queue されてから r.Apply がイベントを生めるよう順序を保証するか、pre-arm イベントの payload をバッファして projection 後に再適用する。"
